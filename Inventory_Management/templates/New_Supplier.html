{% extends 'main.html' %}
{% load static %}

{% block title %}
New Suppliers Add | Inventory Management
{% endblock title %}

{% block content %}
            <!-- Supplier code -->
            <section>
                <div class="container">
                    <div class="row dash-card-1" style=" justify-content: center;">
                        <form method="post" style="width: 50%;" class="mt-5 p-3 card">
                          {% csrf_token %}
                            <h3 class="text-center">New Supplier</h3>
                            <div class="form-group mb-4">
                              <label for="com-name">Company Name</label>
                              <input type="text" class="form-control" id="com-name" placeholder="Enter the company name" name="company_name">
                            </div>
                            <div class="form-group mb-4">
                                <label for="supp-name">Supplier Name</label>
                                <input type="text" class="form-control" id="supp-name" placeholder="Enter the supplier name" name="supplier_name">
                            </div>
                            <div class="form-group mb-4">
                              <label for="supp-number">Supplier Phone Number</label>
                              <input type="number" class="form-control" id="supp-number" placeholder="Enter supplier phone number" name="phone_number">
                            </div>
                            <div class="form-group mb-4">
                               <label for="com-address">Company Address</label>
                               <input type="text" class="form-control" id="com-address" placeholder="Enter company address" name="company_address">
                            </div>
                            <div class="form-group mb-1 mt-1 text-center " >
                              <button class="btn btn-primary " type="submit">Add</button>
                            </div>
                          </form>
                    </div>
                </div>
               </section>
{% endblock content %}
