{% extends 'main.html' %}
{% load static %}

{% block title %}
New Labour Add | Inventory Management
{% endblock title %}

{% block content %}
            <!-- New Labour code -->
            <section>
                <div class="container">
                    <div class="row dash-card-1" style=" justify-content: center;">
                        <form method="post" style="width: 50%;" class="mt-5 p-3 card">
                          {% csrf_token %}
                            <h3 class="text-center">New Labour</h3>
                            <div class="form-group mb-4">
                              <label for="labour-name-1">Labour Name</label>
                              <input type="text" class="form-control" id="labour-name-1" placeholder="Enter the name" name="lab_name">
                            </div>
                            <div class="form-group mb-4">
                                <label for="phone-number">Phone Number</label>
                                <input type="number" class="form-control" id="phone-number" placeholder="Enter the phone number" name="phone_no">
                              </div>
                              <div class="form-group mb-4">
                                <label for="salary">Salary</label>
                                <input type="number" class="form-control" id="salary" placeholder="Enter the salary" name="salary">
                              </div>
                              <div class="form-group mb-2 mt-3 text-center " >
                                <button class="btn btn-primary " type="submit">Add</button>
                              </div>
                          </form>
                    </div>
                </div>
               </section>
{% endblock content %}
