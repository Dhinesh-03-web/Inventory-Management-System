{% extends 'main.html' %}
{% load static %}

{% block title %}
New Product Add | Inventory Management
{% endblock title %}

{% block content %}
           <!-- Dashborad code --> 
           <section>
            <div class="container">
                <div class="row dash-card-1" style=" justify-content: center;">
                    <form method="post" style="width: 50%;" class="mt-5 p-3 card">
                        {% csrf_token %}
                        <h3 class="text-center">New Product</h3>
                        <div class="form-group mb-4">
                          <label for="inputState">Choose Category</label>
                          <select id="inputState" class="form-control" name="cat_name">
                            {% for category in categories %}
                              <option value="{{ category.id }}">{{ category.cat_name }}</option>
                            {% endfor %}
                          </select>
                        </div>
                        <div class="form-group mb-4">
                          <label for="product-name">Proudct Name</label>
                          <input type="text" class="form-control" id="product-name" placeholder="Enter the product name" name="product_name">
                        </div>
                        <div class="form-group mb-4">
                            <label for="in-stock">In Stock</label>
                            <input type="number" class="form-control" id="in-stock" placeholder="Enter In stocks " name="in_stock">
                          </div>
                          <div class="form-group mb-4">
                            <label for="min-stock">Min Stock</label>
                            <input type="number" class="form-control" id="min-stock" placeholder="Enter Min stocks" name="min_stock">
                          </div>
                          <div class="form-group mb-2 mt-2 text-center " >
                            <button class="btn btn-primary " type="submit">Add</button>
                          </div>
                      </form>
                </div>
            </div>
           </section>
{% endblock content %}
